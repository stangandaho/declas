name: Build Declas

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Declas-Windows
          - os: macos-latest
            artifact: Declas-macOS
          - os: ubuntu-latest
            artifact: Declas-Linux

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # On Linux, install CPU-only torch to avoid multi-GB CUDA libraries
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install torch==2.4.1 torchvision==0.19.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller Declas.spec

      #  Package per OS 

      - name: Package (Windows - build installer with Inno Setup)
        if: matrix.os == 'windows-latest'
        run: |
          # Extract the tag (e.g. v1.0.0 -> 1.0.0) for the installer version
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.0.0" }
          iscc /DMyAppVersion=$version installer\declas.iss
        shell: pwsh

      - name: Package (macOS - make a DMG)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          if [ -d "Declas.app" ]; then
            hdiutil create -volname Declas -srcfolder Declas.app -ov -format UDZO Declas-macOS.dmg
          else
            hdiutil create -volname Declas -srcfolder Declas -ov -format UDZO Declas-macOS.dmg
          fi

      - name: Package (Linux - tarball the onedir build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czf Declas-Linux.tar.gz Declas

      #  Upload as build artifacts 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            installer/Output/*.exe
            dist/*.dmg
            dist/*.tar.gz

  #  Attach everything to a GitHub Release 

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true