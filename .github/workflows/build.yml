name: Build Declas

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Declas-Windows

          - os: macos-latest
            artifact: Declas-macOS-arm64
            dmg_name: Declas-macOS-arm64

          - os: macos-15-intel
            artifact: Declas-macOS-Intel
            dmg_name: Declas-macOS-Intel

          - os: ubuntu-latest
            artifact: Declas-Linux

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux system libs
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # On Linux, install CPU-only torch first so the huge CUDA build is not pulled in
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install torch==2.4.1 torchvision==0.19.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller Declas.spec

      #  Package per OS 

      - name: Package (Windows - build installer with Inno Setup)
        if: matrix.os == 'windows-latest'
        run: |
          # Strip the leading v from the tag (e.g. v1.2.0 -> 1.2.0) for the filename.
          # For non-tag test runs, label the build as 0.0.0-dev.
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "0.0.0-dev"
          }
          iscc /DMyAppVersion=$version installer\declas.iss
          # Move the installer to the top level so the artifact has no nested folders
          Move-Item installer\Output\*.exe .
        shell: pwsh

      - name: Package (macOS - make a DMG)
        if: runner.os == 'macOS'
        run: |
          cd dist
          hdiutil create -volname Declas \
            -srcfolder Declas.app \
            -ov -format UDZO \
            ${{ matrix.dmg_name }}.dmg

      - name: Package (Linux - tarball the onedir build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp icons/logo.png dist/Declas/declas.png
          cp installer/declas.desktop dist/Declas/declas.desktop
          cd dist
          tar -czf Declas-Linux.tar.gz Declas

      #  Upload as build artifacts 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Declas_Setup_*.exe
            dist/*.dmg
            dist/*.tar.gz

  #  Attach everything to a GitHub Release 

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
