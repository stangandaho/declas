<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declas: Camera Trap Analysis</title>
  <meta name="description" content="Turn camera trap media into flat, analysable data with AI-driven detection. Runs locally, no internet required.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="card">

      <h1>Declas</h1>
      <!--<img
        class="logo"
        src="https://raw.githubusercontent.com/stangandaho/declas/main/icons/logo.png"
        alt="Declas logo"
      >**/ -->
      
      <p class="tagline">Turn camera trap media into flat, analysable data with AI-driven detection</p>

      <div class="download-area">
        <div class="split-wrap" id="split-wrap">

          <button class="split-main" id="download-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13"/>
              <path d="M7 13l5 5 5-5"/>
              <path d="M3 20h18"/>
            </svg>
            <span id="btn-label">Download</span>
          </button>

          <button
            class="split-arrow"
            id="dropdown-toggle"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-label="Choose platform"
          >
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>

          <ul class="dropdown" id="dropdown" role="listbox" hidden>
            <li>
              <button class="dropdown-item" data-os="windows" role="option">
                <svg viewBox="0 0 24 24" fill="currentColor" class="os-icon">
                  <path d="M3 5.6L10.5 4.5v7H3zM11.5 4.35L21 3v8.5H11.5zM3 12.5h7.5v7L3 18.4zM11.5 12.5H21v8.5l-9.5-1.35z"/>
                </svg>
                Windows
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-os="macos-arm" role="option">
                <svg viewBox="0 0 24 24" fill="currentColor" class="os-icon">
                  <path d="M18.7 17.2c-.5.7-1 1.3-1.8 1.3-.7 0-1-.4-1.8-.4s-1.1.4-1.9.4c-.7 0-1.3-.6-1.8-1.3-1.5-2.1-2.6-5.9-1.1-8.5.7-1.3 2-2.1 3.3-2.1.8 0 1.6.5 2.1.5s1.4-.6 2.3-.6c.6 0 2.4.2 3.5 1.9-.1.1-2.1 1.2-2.1 3.6 0 2.9 2.5 3.8 2.5 3.9-.1.1-.5 1.9-2.2 3.3zM14.5 3c.1 1.7-1.4 3-2.7 3-.2-1.6 1.4-3 2.7-3z"/>
                </svg>
                macOS (Apple Silicon)
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-os="macos-intel" role="option">
                <svg viewBox="0 0 24 24" fill="currentColor" class="os-icon">
                  <path d="M18.7 17.2c-.5.7-1 1.3-1.8 1.3-.7 0-1-.4-1.8-.4s-1.1.4-1.9.4c-.7 0-1.3-.6-1.8-1.3-1.5-2.1-2.6-5.9-1.1-8.5.7-1.3 2-2.1 3.3-2.1.8 0 1.6.5 2.1.5s1.4-.6 2.3-.6c.6 0 2.4.2 3.5 1.9-.1.1-2.1 1.2-2.1 3.6 0 2.9 2.5 3.8 2.5 3.9-.1.1-.5 1.9-2.2 3.3zM14.5 3c.1 1.7-1.4 3-2.7 3-.2-1.6 1.4-3 2.7-3z"/>
                </svg>
                macOS (Intel)
              </button>
            </li>
            <li>
              <button class="dropdown-item" data-os="linux" role="option">
                <svg viewBox="0 0 24 24" class="os-icon">
                  <!-- body + head -->
                  <path d="M12 2C9.8 2 8 3.5 8 5.5c0 1 .4 1.9 1 2.6C7.3 9.4 6.5 11 6.5 13c0 3.6 2.5 6.5 5.5 6.5s5.5-2.9 5.5-6.5c0-2-.8-3.6-2.5-4.9.6-.7 1-1.6 1-2.6C16 3.5 14.2 2 12 2z" fill="currentColor"/>
                  <!-- belly -->
                  <ellipse cx="12" cy="14" rx="2.5" ry="4" fill="white"/>
                  <!-- eyes -->
                  <circle cx="10.2" cy="5.8" r=".9" fill="white"/>
                  <circle cx="13.8" cy="5.8" r=".9" fill="white"/>
                  <!-- feet -->
                  <path d="M9 20l-2 2.5h4zM15 20l2 2.5h-4z" fill="currentColor"/>
                </svg>
                Linux
              </button>
            </li>
          </ul>
        </div>

        <button class="btn-video" id="video-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23 7s-.3-2-1.2-2.8c-1.1-1.2-2.4-1.2-3-1.3C16.2 2.8 12 2.8 12 2.8s-4.2 0-6.8.2c-.6.1-1.9.1-3 1.3C1.3 5 1 7 1 7S.8 9.2.8 11.5v2.1C.8 16 1 18 1 18s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.6 22.2 12 22.2 12 22.2s4.2 0 6.8-.3c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.2-2.2.2-4.4v-2.1C23.2 9.2 23 7 23 7zM9.7 15.5V8.4l8.1 3.6-8.1 3.5z"/>
          </svg>
          Video Docs
        </button>

        <p class="release-tag" id="release-tag"></p>
      </div>

      <div class="counter">
        <strong class="counter-num" id="counter-label">...</strong>
        <span class="counter-label">downloads</span>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
